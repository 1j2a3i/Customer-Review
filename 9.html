<html>
<head>
<title>Customer Review</title>
</head>

<body bgcolor="#45D1F7">

<center>
<marquee>
<h1><font color="blue">Customer Review</font></h1>
</marquee>
</center>

<form id="reviewForm">

<div style="background-color:#4C7D8C;padding:10px;">
<h2>Enter Your Name:</h2>

Enter First Name:
<input type="text" name="fname" required>

<br><br>

Enter Last Name:
<input type="text" name="lname" required>
</div>

<br>

<div style="background-color:#4C7D8C;padding:10px;">
<h2>How was the service?</h2>

<input type="radio" name="service" value="Horrible"> Horrible
<br>
<input type="radio" name="service" value="Bad"> Bad
<br>
<input type="radio" name="service" value="Fine"> Fine
<br>
<input type="radio" name="service" value="Good"> Good
<br>
<input type="radio" name="service" value="Excellent"> Excellent
</div>

<br>

<div style="background-color:#4C7D8C;padding:10px;">
<h2>What did you buy?</h2>

<input type="checkbox" name="product" value="T-Shirts"> T-Shirts
<br>
<input type="checkbox" name="product" value="Cap"> Cap
<br>
<input type="checkbox" name="product" value="Leather Strap Keychain"> Leather Strap Keychain
<br>
<input type="checkbox" name="product" value="Pearl Strap Keychain"> Pearl Strap Keychain
<br>
<input type="checkbox" name="product" value="Acrylic Keychain"> Acrylic Keychain
<br>
<input type="checkbox" name="product" value="Magnet"> Magnet
<br>
<input type="checkbox" name="product" value="Acrylic Magnet"> Acrylic Magnet
</div>

<br>

<div style="background-color:#4C7D8C;padding:10px;">
<h2>What would you prefer?</h2>

<input type="text" name="preference" size="50">
</div>

<br><br>

<center>
<button type="submit">Submit Review</button>
</center>

</form>

<script>
document.getElementById("reviewForm").addEventListener("submit", function(e){

e.preventDefault();

var products = [];
var checked = document.querySelectorAll('input[name="product"]:checked');

checked.forEach(function(item){
    products.push(item.value);
});

var formData = new FormData();

formData.append("fname", document.querySelector('[name="fname"]').value);
formData.append("lname", document.querySelector('[name="lname"]').value);

var service = document.querySelector('input[name="service"]:checked');
formData.append("service", service ? service.value : "");

formData.append("products", products.join(", "));
formData.append("preference", document.querySelector('[name="preference"]').value);

fetch("https://script.google.com/macros/s/AKfycbxul2apf57PY6uG4e76B5a0OHKMUh9BOaJvYgADiLGP6DktU8zPQBD67zReD6X29pSH/exec", {
    method: "POST",
    body: formData
})
.then(response => response.text())
.then(data => {
    alert("Thank you! Your review has been submitted.");
    document.getElementById("reviewForm").reset();
})
.catch(error => {
    alert("Error submitting review.");
    console.log(error);
});

});
</script>

</body>
</html>
